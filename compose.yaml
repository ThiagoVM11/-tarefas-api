services:
  api:
    build: ./app
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://app:app@db:5432/tarefas
    depends_on:
      db: { condition: service_healthy }
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tarefas
    volumes: ["dados:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tarefas"]
      interval: 5s
      retries: 5
volumes:
  dados:
